<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>长隆旅游 - 攻略列表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <script>if(localStorage.getItem('theme')==='dark')document.body.setAttribute('data-theme','dark');</script>
  <script>document.body.classList.add('page-enter');requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.body.classList.remove('page-enter'); }); });</script>
  <!-- 头部：导航栏 -->
  <header>
    <nav class="site-nav" role="navigation">
      <div class="container flex items-center justify-between">
        <div class="nav-brand-wrap">
          <a href="index.html" class="nav-brand">
            <span class="nav-brand-icon" aria-hidden="true"><img src="assets/icons/favicon.ico" alt="" width="32" height="32"></span>
            长隆旅游
          </a>
          <span class="nav-brand-tagline">探索精彩旅程</span>
        </div>
        <ul class="nav-menu hidden md:flex">
          <li><a href="index.html">首页</a></li>
          <li class="nav-dropdown">
            <button type="button" class="nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false">目的地<span class="nav-dropdown-arrow" aria-hidden="true">▾</span></button>
            <ul class="nav-dropdown-menu" role="menu">
              <li role="none"><a href="destinations.html" role="menuitem">全部目的地</a></li>
              <li role="none"><a href="destinations.html?city=广州" role="menuitem">广州长隆</a></li>
              <li role="none"><a href="destinations.html?city=珠海" role="menuitem">珠海长隆</a></li>
            </ul>
          </li>
          <li><a href="guides.html">攻略</a></li>
          <li><a href="analytics.html">数据</a></li>
        </ul>
        <div class="nav-actions flex items-center gap-2">
          <button id="darkModeToggle" class="theme-toggle" aria-label="切换暗黑模式">🌙</button>
          <button class="nav-toggle md:hidden" aria-label="切换菜单">☰</button>
        </div>
      </div>
    </nav>
  </header>

  <!-- 主体：攻略列表页 -->
  <main>
    <section class="guides-section py-12">
      <div class="container">
        <!-- 页面标题 -->
        <div class="guides-header mb-8">
          <h1 class="section-title">旅游攻略 <span class="blink-text">·</span></h1>
          <p class="guides-subtitle text-center text-gray-500">发现精彩旅程，获取专业出行建议</p>
        </div>

        <!-- 排序控制 -->
        <div class="guides-sort-bar mb-6">
          <div class="flex items-center justify-between flex-wrap gap-3">
            <span class="guides-count text-sm text-gray-500" id="guidesCount">共 0 篇攻略</span>
            <div class="sort-options">
              <label class="sort-label text-sm text-gray-600 mr-2">排序：</label>
              <select id="sortSelect" class="sort-select">
                <option value="newest">最新发布</option>
                <option value="oldest">最早发布</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 攻略卡片网格 -->
        <div id="guidesGrid" class="guides-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- 由 JS 动态填充 -->
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="guides-empty hidden">
          <div class="empty-icon">📖</div>
          <p class="empty-text">暂无攻略内容</p>
        </div>
      </div>
    </section>
  </main>

  <!-- 底部：版权与联系方式 -->
  <footer class="site-footer">
    <div class="container text-center">
      <p>© 2025 <span class="footer-brand">长隆旅游</span> 版权所有</p>
      <p class="footer-contact">联系我们：400-xxx-xxxx</p>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="回到顶部">↑</button>

  <script src="js/page-transition.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/back-to-top.js"></script>
  <script src="js/lazy-load.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      initBackToTop('#backToTop');
      initDarkMode('#darkModeToggle');

      var guidesData = [];
      var currentSort = 'newest';

      // 加载攻略数据
      fetch('assets/data/guides.json')
        .then(function(r) { return r.json(); })
        .then(function(guides) {
          guidesData = guides;
          updateGuidesCount(guidesData.length);
          renderGuides(guidesData);
          if (typeof initLazyLoad === 'function') initLazyLoad('img[data-src]');
        })
        .catch(function() {
          document.getElementById('emptyState').classList.remove('hidden');
        });

      // 更新攻略数量
      function updateGuidesCount(count) {
        document.getElementById('guidesCount').textContent = '共 ' + count + ' 篇攻略';
      }

      // 渲染攻略卡片
      function renderGuides(guides) {
        var grid = document.getElementById('guidesGrid');
        var emptyState = document.getElementById('emptyState');

        if (!guides || guides.length === 0) {
          grid.innerHTML = '';
          emptyState.classList.remove('hidden');
          return;
        }

        emptyState.classList.add('hidden');

        // 根据当前排序方式排序
        var sortedGuides = guides.slice().sort(function(a, b) {
          var dateA = new Date(a.publishDate || '1970-01-01');
          var dateB = new Date(b.publishDate || '1970-01-01');
          return currentSort === 'newest' ? dateB - dateA : dateA - dateB;
        });

        grid.innerHTML = sortedGuides.map(function(guide) {
          var dateStr = formatDate(guide.publishDate);
          return '<a href="guide.html?id=' + guide.id + '" class="guide-card">' +
            '<div class="guide-card-img-wrap">' +
              '<img data-src="' + guide.coverUrl + '" src="" alt="' + guide.title + '" class="lazy">' +
              '<div class="guide-card-overlay"></div>' +
            '</div>' +
            '<div class="guide-card-body">' +
              '<h3 class="guide-card-title">' + guide.title + '</h3>' +
              '<div class="guide-card-meta">' +
                '<span class="guide-card-date">' + dateStr + '</span>' +
                '<span class="guide-card-arrow">→</span>' +
              '</div>' +
            '</div>' +
          '</a>';
        }).join('');

        if (typeof initLazyLoad === 'function') initLazyLoad('img[data-src]');
      }

      // 格式化日期
      function formatDate(dateStr) {
        if (!dateStr) return '';
        var date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;
        return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日';
      }

      // 排序切换
      document.getElementById('sortSelect').addEventListener('change', function(e) {
        currentSort = e.target.value;
        renderGuides(guidesData);
      });
    });
  </script>
</body>
</html>
